name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish self-contained Windows app
        run: dotnet publish GestorTareas/GestorTareas/GestorTareas.csproj -c Release -r win-x64 --self-contained true -o publish/TrayTasks-win-x64

      - name: Package ZIP
        run: Compress-Archive -Path publish/TrayTasks-win-x64/* -DestinationPath publish/TrayTasks-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: publish/TrayTasks-win-x64.zip
